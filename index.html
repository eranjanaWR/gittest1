<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            color: #333;
        }
        p {
            color: #555;
        }
        .ball {
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            position: relative;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { top: 0; }
            50% { top: 200px; }
        }
    </style>
</head>
<body>
    <h1>Hello, World!</h1>
    <p>This is a simple HTML file.</p>
    <button class="start-btn">Start</button>
        .start-btn {
            background-color: #e53935;
            color: #fff;
            border: none;
            padding: 12px 32px;
            font-size: 1.2em;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 24px;
            transition: background 0.2s;
        }
        .start-btn:hover {
            background-color: #b71c1c;
        }
    <div class="ball"></div>
</body>
</html>
